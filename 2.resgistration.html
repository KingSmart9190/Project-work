<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN & REGISTRATION FORM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h1>REGISTER</h1>
        <input type="text"
                   id="firstname"
                   placeholder="First name"
                   required/>
        <input type="text"
                   id="lastname"
                   placeholder="Last name"
                   required/>
        <input type="text"
               id="name"
               placeholder="Username"
               required/>
        <input type="email"
                   id="email"
                   placeholder="Email"
                   required/>
        <input type="password"
                   id="password"
                   placeholder="Password"
                   required/>
        <input type="password"
                   id="password"
                   placeholder="Confirm Password"
                   required/>
        <br><br>
        <span>
            <input type="checkbox">
            Agree to all terms & condition.
        </span>
        <button>REGISTER</button>
        <span>
            Already have an account?
            <a href="1.login.html"> login</a>
        </span>
        <script href="main.js"></script>
    </div>
</body>
</html>
